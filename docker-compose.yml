version: '3.9'

services:

  nginx:
    image: nginx:alpine
    container_name: tramite_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - tramite_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tramite_frontend
    restart: unless-stopped
    networks:
      - tramite_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tramite_api
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - tramite_net

  postgres:
    image: postgres:15-alpine
    container_name: tramite_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tramite_db
      POSTGRES_USER: tramite_user
      POSTGRES_PASSWORD: tramite_pass123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d
    networks:
      - tramite_net

  redis:
    image: redis:7-alpine
    container_name: tramite_redis
    restart: unless-stopped
    networks:
      - tramite_net

  minio:
    image: minio/minio
    container_name: tramite_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - tramite_net

volumes:
  pgdata:
  minio-data:

networks:
  tramite_net:
    driver: bridge
